<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطب البيطري - AcademicVETnew</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        primary: {
                            50: '#faf5ff', 100: '#f3e8ff', 200: '#e9d5ff', 300: '#d8b4fe', 
                            400: '#c084fc', 500: '#a855f7', 600: '#9333ea', 700: '#7c3aed', 
                            800: '#6b21a8', 900: '#581c87',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // إعداد Supabase (نفس المفاتيح التي زودتني بها)
        const SUPABASE_URL = "https://rmwrsbdmiwhhbanfirtx.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtd3JzYmRtaXdoaGJhbmZpcnR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY5MzQ2NTMsImV4cCI6MjA3MjUxMDY1M30.kBeJkAjO4r6ZDNrarHh9MkzfErPCt4TtilUgclqccvk";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- المكون الرئيسي ---
        const AcademicVETnew = () => {
            const [currentUser, setCurrentUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [currentView, setCurrentView] = useState('login');
            const [notifications, setNotifications] = useState([]);

            // نظام الإشعارات
            const showNotification = (message, type = 'info') => {
                const id = Date.now();
                setNotifications(prev => [...prev, { id, message, type }]);
                setTimeout(() => setNotifications(prev => prev.filter(n => n.id !== id)), 4000);
            };

            const handleLogin = (credentials) => {
                if (credentials.username === 'AcademicVETnew' && credentials.password === 'AcaDemic_2025_New') {
                    setIsAdmin(true);
                    setCurrentUser({ name: 'المدير', id: 'admin' });
                    setCurrentView('admin-dashboard');
                    showNotification('أهلاً بك أيها المدير', 'success');
                } else {
                    setCurrentUser({
                        id: Date.now(),
                        name: credentials.name || 'طالب بيطري',
                        study_year: credentials.study_year || 1
                    });
                    setCurrentView('dashboard');
                    showNotification(`أهلاً دكتور ${credentials.name || ''}`, 'success');
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setCurrentView('login');
            };

            const renderCurrentView = () => {
                switch (currentView) {
                    case 'login': return <LoginPage onLogin={handleLogin} />;
                    case 'dashboard': return <StudentDashboard user={currentUser} onViewChange={setCurrentView} />;
                    case 'chat': return <ChatPage user={currentUser} onViewChange={setCurrentView} onNotification={showNotification} />;
                    case 'posts': return <PostsPage user={currentUser} onViewChange={setCurrentView} onNotification={showNotification} />;
                    case 'subjects': return <SubjectsPage onViewChange={setCurrentView} />;
                    case 'materials': return <UniversityMaterials onViewChange={setCurrentView} />;
                    case 'tools': return <ToolsPage onViewChange={setCurrentView} onNotification={showNotification} />;
                    case 'admin-dashboard': return <AdminDashboard onViewChange={setCurrentView} />;
                    default: return <StudentDashboard user={currentUser} onViewChange={setCurrentView} />;
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-50 to-white" dir="rtl">
                    {/* شريط التنقل */}
                    {currentUser && (
                        <nav className="bg-white shadow-md border-b border-primary-100 sticky top-0 z-40">
                            <div className="max-w-7xl mx-auto px-4">
                                <div className="flex justify-between items-center h-16">
                                    <div className="flex items-center gap-6">
                                        <h1 className="text-2xl font-bold text-primary-700 ml-4">🐾 بيطري أكاديمي</h1>
                                        {!isAdmin && (
                                            <div className="hidden md:flex gap-4">
                                                <NavBtn active={currentView === 'dashboard'} onClick={() => setCurrentView('dashboard')}>الرئيسية</NavBtn>
                                                <NavBtn active={currentView === 'subjects'} onClick={() => setCurrentView('subjects')}>المواد</NavBtn>
                                                <NavBtn active={currentView === 'materials'} onClick={() => setCurrentView('materials')}>الملفات</NavBtn>
                                                <NavBtn active={currentView === 'tools'} onClick={() => setCurrentView('tools')}>الأدوات</NavBtn>
                                                <NavBtn active={currentView === 'chat'} onClick={() => setCurrentView('chat')}>المحادثة</NavBtn>
                                                <NavBtn active={currentView === 'posts'} onClick={() => setCurrentView('posts')}>المجتمع</NavBtn>
                                            </div>
                                        )}
                                    </div>
                                    <button onClick={handleLogout} className="text-red-500 hover:bg-red-50 px-4 py-2 rounded-lg transition">خروج</button>
                                </div>
                            </div>
                        </nav>
                    )}

                    {/* الإشعارات */}
                    <div className="fixed top-20 left-4 z-50 space-y-2">
                        {notifications.map(n => (
                            <div key={n.id} className={`px-6 py-3 rounded-lg shadow-lg text-white animate-bounce-in ${n.type === 'success' ? 'bg-green-600' : 'bg-primary-600'}`}>
                                {n.message}
                            </div>
                        ))}
                    </div>

                    <main className="p-4">{renderCurrentView()}</main>
                </div>
            );
        };

        const NavBtn = ({ children, onClick, active }) => (
            <button 
                onClick={onClick} 
                className={`px-3 py-2 rounded-lg font-medium transition ${active ? 'bg-primary-100 text-primary-700' : 'text-gray-600 hover:text-primary-600 hover:bg-gray-50'}`}
            >
                {children}
            </button>
        );

        // --- صفحة الدخول ---
        const LoginPage = ({ onLogin }) => {
            const [isSignup, setIsSignup] = useState(false);
            const [formData, setFormData] = useState({ name: '', study_year: 1, username: '', password: '' });

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-primary-100">
                        <div className="text-center mb-8">
                            <span className="text-5xl block mb-2">🐾</span>
                            <h2 className="text-3xl font-bold text-primary-700">بيطري أكاديمي</h2>
                            <p className="text-gray-500">منصتك الشاملة للنجاح الجامعي</p>
                        </div>
                        
                        <form onSubmit={(e) => { e.preventDefault(); onLogin(formData); }} className="space-y-4">
                            {isSignup ? (
                                <>
                                    <input type="text" placeholder="الاسم الكامل" onChange={e => setFormData({...formData, name: e.target.value})} className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none" required />
                                    <select onChange={e => setFormData({...formData, study_year: e.target.value})} className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none">
                                        {[1,2,3,4,5,6].map(y => <option key={y} value={y}>السنة {y}</option>)}
                                    </select>
                                    <input type="password" placeholder="كلمة المرور" onChange={e => setFormData({...formData, password: e.target.value})} className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none" required />
                                </>
                            ) : (
                                <>
                                    <input type="text" placeholder="اسم المستخدم" onChange={e => setFormData({...formData, username: e.target.value})} className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none" />
                                    <input type="password" placeholder="كلمة المرور" onChange={e => setFormData({...formData, password: e.target.value})} className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none" />
                                </>
                            )}
                            <button className="w-full bg-primary-600 text-white py-3 rounded-xl font-bold hover:bg-primary-700 transition shadow-lg shadow-primary-200">
                                {isSignup ? 'إنشاء حساب' : 'تسجيل الدخول'}
                            </button>
                        </form>
                        
                        <div className="mt-6 text-center">
                            <button onClick={() => setIsSignup(!isSignup)} className="text-primary-600 hover:text-primary-800 font-medium">
                                {isSignup ? "لديك حساب؟ سجل دخول" : "طالب جديد؟ أنشئ حساباً"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- لوحة التحكم ---
        const StudentDashboard = ({ user, onViewChange }) => (
            <div className="max-w-6xl mx-auto">
                <div className="bg-white rounded-2xl shadow-lg p-8 mb-8 border border-primary-50 relative overflow-hidden">
                    <div className="relative z-10">
                        <h1 className="text-3xl font-bold text-primary-800 mb-2">أهلاً بك، {user.name}! 👋</h1>
                        <p className="text-gray-600">طالب في السنة {user.study_year} • كلية الطب البيطري</p>
                    </div>
                    <div className="absolute top-0 left-0 w-32 h-32 bg-primary-100 rounded-full -translate-x-10 -translate-y-10 opacity-50"></div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <DashboardCard icon="📚" title="المواد الدراسية" desc="محاضرات وسلايدات" onClick={() => onViewChange('subjects')} />
                    <DashboardCard icon="🏛️" title="ملفات الجامعة" desc="إجباري واختياري" onClick={() => onViewChange('materials')} />
                    <DashboardCard icon="🛠️" title="أدوات الدراسة" desc="GPA ومؤقت بومودورو" onClick={() => onViewChange('tools')} />
                    <DashboardCard icon="💬" title="المحادثة" desc="تواصل مباشر" onClick={() => onViewChange('chat')} highlight />
                    <DashboardCard icon="📝" title="المجتمع" desc="أسئلة ونقاشات" onClick={() => onViewChange('posts')} highlight />
                </div>
            </div>
        );

        const DashboardCard = ({ icon, title, desc, onClick, highlight }) => (
            <div onClick={onClick} className={`bg-white p-6 rounded-2xl shadow-md cursor-pointer hover:shadow-xl transition border border-transparent hover:border-primary-200 group ${highlight ? 'ring-2 ring-primary-100' : ''}`}>
                <div className="flex items-center gap-4">
                    <div className="text-4xl bg-gray-50 p-3 rounded-xl group-hover:bg-primary-50 transition">{icon}</div>
                    <div>
                        <h3 className="text-lg font-bold text-gray-800 group-hover:text-primary-700">{title}</h3>
                        <p className="text-sm text-gray-500">{desc}</p>
                    </div>
                </div>
            </div>
        );

        // --- صفحة المواد الدراسية (مسترجعة) ---
        const SubjectsPage = ({ onViewChange }) => {
            const [view, setView] = useState('years');
            const [selectedYear, setSelectedYear] = useState(null);
            const [selectedSemester, setSelectedSemester] = useState(null);

            const subjectsData = {
                1: { 'الأول': ['تشريح 1', 'فسيولوجي 1', 'كيمياء حيوية'], 'الثاني': ['تشريح 2', 'أنسجة', 'فسيولوجي 2'] },
                2: { 'الأول': ['بكتيريا', 'مناعة', 'تغذية'], 'الثاني': ['فيروسات', 'طفيليات', 'وراثة'] }
            };

            if (selectedSemester) return (
                <div className="max-w-4xl mx-auto">
                    <button onClick={() => setSelectedSemester(null)} className="mb-4 text-primary-600">← عودة للفصول</button>
                    <h2 className="text-2xl font-bold text-primary-700 mb-6">مواد السنة {selectedYear} - الفصل {selectedSemester}</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {(subjectsData[selectedYear]?.[selectedSemester] || ['مادة 1', 'مادة 2', 'مادة 3']).map((sub, i) => (
                            <div key={i} className="bg-white p-6 rounded-xl shadow border hover:border-primary-400 cursor-pointer">
                                <h3 className="font-bold text-lg">{sub}</h3>
                                <p className="text-sm text-gray-500">اضغط للذهاب للملفات</p>
                            </div>
                        ))}
                    </div>
                </div>
            );

            if (selectedYear) return (
                <div className="max-w-4xl mx-auto">
                    <button onClick={() => setSelectedYear(null)} className="mb-4 text-primary-600">← عودة للسنوات</button>
                    <h2 className="text-2xl font-bold text-primary-700 mb-6">فصول السنة {selectedYear}</h2>
                    <div className="grid grid-cols-3 gap-6">
                        {['الأول', 'الثاني', 'الصيفي'].map(sem => (
                            <div key={sem} onClick={() => setSelectedSemester(sem)} className="bg-white p-8 rounded-xl shadow text-center cursor-pointer hover:bg-primary-50 transition">
                                <div className="text-3xl mb-2">📅</div>
                                <h3 className="font-bold">الفصل {sem}</h3>
                            </div>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="max-w-6xl mx-auto">
                    <h2 className="text-2xl font-bold text-primary-700 mb-6">اختر السنة الدراسية</h2>
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-6">
                        {[1,2,3,4,5,6].map(y => (
                            <div key={y} onClick={() => setSelectedYear(y)} className="bg-white p-8 rounded-xl shadow hover:shadow-lg cursor-pointer border border-transparent hover:border-primary-300 text-center transition">
                                <div className="bg-primary-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold text-primary-700">{y}</div>
                                <h3 className="text-xl font-bold">السنة {y}</h3>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- صفحة ملفات الجامعة (مسترجعة) ---
        const UniversityMaterials = ({ onViewChange }) => {
            const [category, setCategory] = useState(null);
            const materials = {
                'إجباري': ['أخلاقيات مهنة', 'صحة عامة', 'مهارات بحث'],
                'اختياري': ['طب حيوانات غريبة', 'تغذية علاجية', 'سلوك حيوان']
            };

            if (category) return (
                <div className="max-w-4xl mx-auto">
                    <button onClick={() => setCategory(null)} className="mb-4 text-primary-600">← عودة للتصنيفات</button>
                    <h2 className="text-2xl font-bold text-primary-700 mb-6">المواد {category}</h2>
                    <div className="grid grid-cols-1 gap-4">
                        {materials[category].map((item, i) => (
                            <div key={i} className="bg-white p-4 rounded-xl shadow flex justify-between items-center">
                                <span className="font-bold">{item}</span>
                                <button className="text-primary-600 bg-primary-50 px-3 py-1 rounded">تحميل ⬇</button>
                            </div>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="max-w-4xl mx-auto">
                    <h2 className="text-2xl font-bold text-primary-700 mb-6">ملفات متطلبات الجامعة</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        {Object.keys(materials).map(cat => (
                            <div key={cat} onClick={() => setCategory(cat)} className="bg-white p-10 rounded-2xl shadow-lg cursor-pointer hover:scale-105 transition text-center border border-gray-100">
                                <div className="text-5xl mb-4">{cat === 'إجباري' ? '📕' : '📘'}</div>
                                <h3 className="text-2xl font-bold text-gray-800">متطلب {cat}</h3>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- صفحة الأدوات (مسترجعة) ---
        const ToolsPage = ({ onViewChange, onNotification }) => {
            const [activeTab, setActiveTab] = useState('gpa');
            
            // GPA State
            const [courses, setCourses] = useState([{ grade: 'A', credits: 3 }]);
            const gradePoints = { 'A+': 4.2, 'A': 4.0, 'B+': 3.5, 'B': 3.0, 'C+': 2.5, 'C': 2.0, 'D': 1.5, 'F': 0 };
            
            // Timer State
            const [time, setTime] = useState(25 * 60);
            const [isActive, setIsActive] = useState(false);

            // ToDo State
            const [tasks, setTasks] = useState([]);
            const [newTask, setNewTask] = useState('');

            // GPA Logic
            const calculateGPA = () => {
                const totalPoints = courses.reduce((acc, curr) => acc + (gradePoints[curr.grade] * curr.credits), 0);
                const totalCredits = courses.reduce((acc, curr) => acc + curr.credits, 0);
                return totalCredits ? (totalPoints / totalCredits).toFixed(2) : '0.00';
            };

            // Timer Logic
            useEffect(() => {
                let interval = null;
                if (isActive && time > 0) interval = setInterval(() => setTime(t => t - 1), 1000);
                else if (time === 0) { setIsActive(false); onNotification('انتهى الوقت!', 'success'); }
                return () => clearInterval(interval);
            }, [isActive, time]);

            return (
                <div className="max-w-4xl mx-auto">
                    <div className="flex bg-white rounded-xl shadow mb-6 overflow-hidden">
                        <button onClick={() => setActiveTab('gpa')} className={`flex-1 py-4 font-bold ${activeTab === 'gpa' ? 'bg-primary-600 text-white' : 'hover:bg-gray-50'}`}>📊 حاسبة المعدل</button>
                        <button onClick={() => setActiveTab('timer')} className={`flex-1 py-4 font-bold ${activeTab === 'timer' ? 'bg-primary-600 text-white' : 'hover:bg-gray-50'}`}>⏱️ مؤقت بومودورو</button>
                        <button onClick={() => setActiveTab('todo')} className={`flex-1 py-4 font-bold ${activeTab === 'todo' ? 'bg-primary-600 text-white' : 'hover:bg-gray-50'}`}>✅ المهام</button>
                    </div>

                    <div className="bg-white p-6 rounded-2xl shadow-lg border border-primary-50">
                        {activeTab === 'gpa' && (
                            <div>
                                <div className="flex justify-between items-center mb-6 bg-primary-50 p-4 rounded-xl">
                                    <h3 className="text-xl font-bold text-primary-800">المعدل الفصلي</h3>
                                    <span className="text-4xl font-bold text-primary-600">{calculateGPA()}</span>
                                </div>
                                {courses.map((c, i) => (
                                    <div key={i} className="flex gap-4 mb-4 items-center">
                                        <select value={c.grade} onChange={e => { const newC = [...courses]; newC[i].grade = e.target.value; setCourses(newC); }} className="p-2 border rounded flex-1">
                                            {Object.keys(gradePoints).map(g => <option key={g} value={g}>{g}</option>)}
                                        </select>
                                        <input type="number" value={c.credits} onChange={e => { const newC = [...courses]; newC[i].credits = parseInt(e.target.value); setCourses(newC); }} className="p-2 border rounded w-20" min="1" />
                                        <button onClick={() => setCourses(courses.filter((_, idx) => idx !== i))} className="text-red-500">🗑️</button>
                                    </div>
                                ))}
                                <button onClick={() => setCourses([...courses, { grade: 'A', credits: 3 }])} className="w-full py-2 border-2 border-dashed border-primary-300 text-primary-600 rounded-lg font-bold">+ إضافة مادة</button>
                            </div>
                        )}

                        {activeTab === 'timer' && (
                            <div className="text-center py-10">
                                <div className="text-8xl font-bold text-primary-700 mb-8 font-mono">
                                    {Math.floor(time / 60).toString().padStart(2, '0')}:{(time % 60).toString().padStart(2, '0')}
                                </div>
                                <div className="flex justify-center gap-4">
                                    <button onClick={() => setIsActive(!isActive)} className={`px-8 py-3 rounded-xl text-white font-bold text-xl ${isActive ? 'bg-red-500' : 'bg-primary-600'}`}>{isActive ? 'إيقاف' : 'ابدأ'}</button>
                                    <button onClick={() => { setIsActive(false); setTime(25 * 60); }} className="px-8 py-3 rounded-xl bg-gray-200 text-gray-700 font-bold text-xl">تصفير</button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'todo' && (
                            <div>
                                <div className="flex gap-2 mb-6">
                                    <input type="text" value={newTask} onChange={e => setNewTask(e.target.value)} placeholder="مهمة جديدة..." className="flex-1 p-3 border rounded-xl" onKeyPress={e => e.key === 'Enter' && setTasks([...tasks, { txt: newTask, done: false }])} />
                                    <button onClick={() => { if(newTask) { setTasks([...tasks, { txt: newTask, done: false }]); setNewTask(''); } }} className="bg-primary-600 text-white px-6 rounded-xl font-bold">إضافة</button>
                                </div>
                                <div className="space-y-2">
                                    {tasks.map((t, i) => (
                                        <div key={i} className={`p-4 rounded-xl flex justify-between items-center ${t.done ? 'bg-green-50 line-through text-gray-400' : 'bg-gray-50'}`}>
                                            <span onClick={() => { const n = [...tasks]; n[i].done = !n[i].done; setTasks(n); }} className="cursor-pointer select-none">{t.txt}</span>
                                            <button onClick={() => setTasks(tasks.filter((_, idx) => idx !== i))} className="text-red-500">✕</button>
                                        </div>
                                    ))}
                                    {tasks.length === 0 && <p className="text-center text-gray-400">لا توجد مهام.. استرح قليلاً! ☕</p>}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- صفحة المحادثة (مع Supabase) ---
        const ChatPage = ({ user, onViewChange, onNotification }) => {
            const [messages, setMessages] = useState([]);
            const [newMessage, setNewMessage] = useState('');
            const messagesEndRef = useRef(null);

            useEffect(() => {
                const fetchMessages = async () => {
                    const { data } = await supabase.from('chat_messages').select('*').order('created_at', { ascending: true });
                    if (data) setMessages(data);
                };
                fetchMessages();
                const channel = supabase.channel('realtime_chat').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, (payload) => {
                    setMessages(prev => [...prev, payload.new]);
                }).subscribe();
                return () => supabase.removeChannel(channel);
            }, []);

            useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);

            const sendMessage = async () => {
                if (!newMessage.trim()) return;
                const { error } = await supabase.from('chat_messages').insert([{ content: newMessage, sender_name: user.name, is_admin: user.id === 'admin' }]);
                if (!error) setNewMessage('');
            };

            return (
                <div className="max-w-4xl mx-auto h-[calc(100vh-140px)] flex flex-col bg-white rounded-2xl shadow-xl border border-primary-100 overflow-hidden">
                    <div className="bg-primary-50 p-4 border-b border-primary-100 flex justify-between items-center">
                        <h3 className="font-bold text-primary-800">💬 المحادثة العامة</h3>
                        <span className="text-xs text-primary-600 bg-primary-100 px-2 py-1 rounded-full">متصل</span>
                    </div>
                    <div className="flex-1 p-4 overflow-y-auto space-y-4 bg-gray-50/50">
                        {messages.map((msg, i) => (
                            <div key={i} className={`flex ${msg.sender_name === user.name ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[75%] p-3 rounded-2xl shadow-sm ${msg.sender_name === user.name ? 'bg-primary-600 text-white rounded-tl-none' : 'bg-white text-gray-800 rounded-tr-none border border-gray-100'}`}>
                                    <div className={`text-xs mb-1 font-bold ${msg.sender_name === user.name ? 'text-primary-100' : 'text-primary-600'}`}>{msg.sender_name}</div>
                                    <div className="leading-relaxed">{msg.content}</div>
                                </div>
                            </div>
                        ))}
                        <div ref={messagesEndRef} />
                    </div>
                    <div className="p-4 bg-white border-t flex gap-2">
                        <input type="text" value={newMessage} onChange={e => setNewMessage(e.target.value)} onKeyPress={e => e.key === 'Enter' && sendMessage()} className="flex-1 p-3 border rounded-xl focus:ring-2 focus:ring-primary-500 outline-none bg-gray-50" placeholder="اكتب رسالتك..." />
                        <button onClick={sendMessage} className="bg-primary-600 text-white px-6 rounded-xl hover:bg-primary-700 transition">➤</button>
                    </div>
                </div>
            );
        };

        // --- صفحة المنشورات (مع Supabase) ---
        const PostsPage = ({ user, onViewChange, onNotification }) => {
            const [posts, setPosts] = useState([]);
            const [newPost, setNewPost] = useState('');

            useEffect(() => {
                const fetchPosts = async () => {
                    const { data } = await supabase.from('posts').select('*').order('created_at', { ascending: false });
                    if (data) setPosts(data);
                };
                fetchPosts();
                const channel = supabase.channel('realtime_posts').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, (payload) => {
                    setPosts(prev => [payload.new, ...prev]);
                }).subscribe();
                return () => supabase.removeChannel(channel);
            }, []);

            const createPost = async () => {
                if (!newPost.trim()) return;
                const { error } = await supabase.from('posts').insert([{ content: newPost, author_name: user.name, study_year: user.study_year }]);
                if (!error) { setNewPost(''); onNotification('تم النشر!', 'success'); }
            };

            return (
                <div className="max-w-3xl mx-auto space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-lg border border-primary-50">
                        <textarea value={newPost} onChange={e => setNewPost(e.target.value)} className="w-full p-4 border rounded-xl mb-4 focus:ring-2 focus:ring-primary-500 outline-none resize-none bg-gray-50" placeholder="شارك سؤالاً أو معلومة..." rows="3"></textarea>
                        <button onClick={createPost} className="w-full bg-primary-600 text-white py-3 rounded-xl font-bold hover:bg-primary-700 transition shadow-md">نشر مشاركة</button>
                    </div>
                    <div className="space-y-4">
                        {posts.map(post => (
                            <div key={post.id} className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition">
                                <div className="flex items-center gap-3 mb-3">
                                    <div className="w-10 h-10 bg-gradient-to-br from-primary-400 to-primary-600 rounded-full flex items-center justify-center text-white font-bold">{post.author_name[0]}</div>
                                    <div>
                                        <div className="font-bold text-gray-800">{post.author_name}</div>
                                        <div className="text-xs text-gray-500">سنة {post.study_year} • {new Date(post.created_at).toLocaleDateString('ar-EG')}</div>
                                    </div>
                                </div>
                                <p className="text-gray-700 leading-relaxed">{post.content}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const AdminDashboard = ({onViewChange}) => <div className="text-center p-10"><h1 className="text-2xl font-bold">لوحة المدير</h1><p>قيد التطوير...</p><button onClick={()=>onViewChange('login')} className="text-red-500 mt-4">خروج</button></div>;

        ReactDOM.render(<AcademicVETnew />, document.getElementById('root'));
    </script>
</body>
</html>
