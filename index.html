<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطب البيطري - AcademicVETnew</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        primary: {
                            50: '#faf5ff', 100: '#f3e8ff', 200: '#e9d5ff', 300: '#d8b4fe', 
                            400: '#c084fc', 500: '#a855f7', 600: '#9333ea', 700: '#7c3aed', 
                            800: '#6b21a8', 900: '#581c87',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // إعداد Supabase
        const SUPABASE_URL = "https://rmwrsbdmiwhhbanfirtx.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtd3JzYmRtaXdoaGJhbmZpcnR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY5MzQ2NTMsImV4cCI6MjA3MjUxMDY1M30.kBeJkAjO4r6ZDNrarHh9MkzfErPCt4TtilUgclqccvk";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- المكون الرئيسي ---
        const AcademicVETnew = () => {
            const [currentUser, setCurrentUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [currentView, setCurrentView] = useState('login');
            const [notifications, setNotifications] = useState([]);

            const handleLogin = async (credentials) => {
                // محاكاة تسجيل الدخول (يمكن تطويرها لاحقاً لتكون حقيقية)
                if (credentials.username === 'AcademicVETnew' && credentials.password === 'AcaDemic_2025_New') {
                    setIsAdmin(true);
                    setCurrentUser({ name: 'المدير', id: 'admin' });
                    setCurrentView('admin-dashboard');
                } else {
                    setCurrentUser({
                        id: Date.now(),
                        name: credentials.name || 'طالب بيطري',
                        study_year: credentials.study_year || 1
                    });
                    setCurrentView('dashboard');
                }
            };

            const showNotification = (message, type = 'info') => {
                const id = Date.now();
                setNotifications(prev => [...prev, { id, message, type }]);
                setTimeout(() => setNotifications(prev => prev.filter(n => n.id !== id)), 4000);
            };

            const renderCurrentView = () => {
                switch (currentView) {
                    case 'login': return <LoginPage onLogin={handleLogin} />;
                    case 'dashboard': return <StudentDashboard user={currentUser} onViewChange={setCurrentView} />;
                    case 'chat': return <ChatPage user={currentUser} onViewChange={setCurrentView} onNotification={showNotification} />;
                    case 'posts': return <PostsPage user={currentUser} onViewChange={setCurrentView} onNotification={showNotification} />;
                    case 'subjects': return <SubjectsPage onViewChange={setCurrentView} />;
                    default: return <div className="p-10 text-center">صفحة قيد التطوير <button onClick={()=>setCurrentView('dashboard')} className="text-blue-500">عودة</button></div>;
                }
            };

            return (
                <div className="min-h-screen bg-gray-50" dir="rtl">
                    {currentUser && (
                        <nav className="bg-white shadow-md p-4 flex justify-between items-center">
                            <h1 className="text-xl font-bold text-primary-700">🐾 بيطري أكاديمي</h1>
                            <div className="space-x-4 space-x-reverse">
                                <button onClick={() => setCurrentView('dashboard')} className="hover:text-primary-600">الرئيسية</button>
                                <button onClick={() => setCurrentView('chat')} className="hover:text-primary-600">المحادثة</button>
                                <button onClick={() => setCurrentView('posts')} className="hover:text-primary-600">المجتمع</button>
                                <button onClick={() => setCurrentView('login')} className="text-red-500 mr-4">خروج</button>
                            </div>
                        </nav>
                    )}
                    
                    <div className="fixed top-4 left-4 z-50 space-y-2">
                        {notifications.map(n => (
                            <div key={n.id} className={`px-4 py-2 rounded text-white ${n.type === 'success' ? 'bg-green-500' : 'bg-blue-500'}`}>{n.message}</div>
                        ))}
                    </div>

                    <main>{renderCurrentView()}</main>
                </div>
            );
        };

        // --- صفحة الدخول ---
        const LoginPage = ({ onLogin }) => {
            const [formData, setFormData] = useState({ name: '', study_year: 1, username: '', password: '' });
            const [isSignup, setIsSignup] = useState(true);

            return (
                <div className="min-h-screen flex items-center justify-center">
                    <div className="bg-white p-8 rounded-xl shadow-xl w-96">
                        <h2 className="text-2xl font-bold text-center text-primary-700 mb-6">مرحباً بك</h2>
                        <form onSubmit={(e) => { e.preventDefault(); onLogin(formData); }} className="space-y-4">
                            {isSignup ? (
                                <>
                                    <input type="text" placeholder="الاسم" onChange={e => setFormData({...formData, name: e.target.value})} className="w-full p-2 border rounded" required />
                                    <select onChange={e => setFormData({...formData, study_year: e.target.value})} className="w-full p-2 border rounded">
                                        {[1,2,3,4,5].map(y => <option key={y} value={y}>السنة {y}</option>)}
                                    </select>
                                </>
                            ) : (
                                <>
                                    <input type="text" placeholder="المستخدم" onChange={e => setFormData({...formData, username: e.target.value})} className="w-full p-2 border rounded" />
                                    <input type="password" placeholder="كلمة السر" onChange={e => setFormData({...formData, password: e.target.value})} className="w-full p-2 border rounded" />
                                </>
                            )}
                            <button className="w-full bg-primary-600 text-white py-2 rounded hover:bg-primary-700">دخول</button>
                        </form>
                        <button onClick={() => setIsSignup(!isSignup)} className="w-full mt-4 text-sm text-gray-500">
                            {isSignup ? "لديك حساب؟ سجل دخول" : "طالب جديد؟"}
                        </button>
                    </div>
                </div>
            );
        };

        // --- لوحة التحكم ---
        const StudentDashboard = ({ user, onViewChange }) => (
            <div className="max-w-4xl mx-auto p-6">
                <div className="bg-white p-6 rounded-xl shadow-md mb-6">
                    <h2 className="text-2xl font-bold text-primary-800">أهلاً دكتور {user.name} 👨‍⚕️</h2>
                    <p className="text-gray-600">طالب سنة {user.study_year}</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div onClick={() => onViewChange('chat')} className="bg-white p-6 rounded-xl shadow cursor-pointer hover:shadow-lg border-t-4 border-primary-500">
                        <h3 className="text-lg font-bold">💬 المحادثة العامة</h3>
                        <p className="text-gray-500">تواصل مع الإدارة والطلاب</p>
                    </div>
                    <div onClick={() => onViewChange('posts')} className="bg-white p-6 rounded-xl shadow cursor-pointer hover:shadow-lg border-t-4 border-primary-500">
                        <h3 className="text-lg font-bold">📝 المجتمع الطلابي</h3>
                        <p className="text-gray-500">شارك الأسئلة والملخصات</p>
                    </div>
                    <div onClick={() => onViewChange('subjects')} className="bg-white p-6 rounded-xl shadow cursor-pointer hover:shadow-lg border-t-4 border-primary-500">
                        <h3 className="text-lg font-bold">📚 المواد الدراسية</h3>
                        <p className="text-gray-500">تصفح المحاضرات</p>
                    </div>
                </div>
            </div>
        );

        // --- صفحة المحادثة (Real Database) ---
        const ChatPage = ({ user, onViewChange, onNotification }) => {
            const [messages, setMessages] = useState([]);
            const [newMessage, setNewMessage] = useState('');
            const messagesEndRef = useRef(null);

            // جلب الرسائل + الاشتراك في التحديثات الفورية
            useEffect(() => {
                // 1. جلب الرسائل القديمة
                const fetchMessages = async () => {
                    const { data, error } = await supabase
                        .from('chat_messages')
                        .select('*')
                        .order('created_at', { ascending: true });
                    if (data) setMessages(data);
                };
                fetchMessages();

                // 2. الاشتراك في التحديث الفوري (Realtime)
                const channel = supabase
                    .channel('realtime_chat')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, (payload) => {
                        setMessages(prev => [...prev, payload.new]);
                    })
                    .subscribe();

                return () => supabase.removeChannel(channel);
            }, []);

            // النزول لأسفل المحادثة تلقائياً
            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages]);

            const sendMessage = async () => {
                if (!newMessage.trim()) return;

                const { error } = await supabase
                    .from('chat_messages')
                    .insert([{ 
                        content: newMessage, 
                        sender_name: user.name,
                        is_admin: user.id === 'admin'
                    }]);

                if (error) {
                    onNotification('فشل الإرسال', 'error');
                } else {
                    setNewMessage('');
                }
            };

            return (
                <div className="max-w-4xl mx-auto p-4 h-[calc(100vh-100px)] flex flex-col">
                    <button onClick={() => onViewChange('dashboard')} className="text-right text-gray-500 mb-2">← عودة</button>
                    <div className="bg-white rounded-xl shadow-lg flex-1 flex flex-col overflow-hidden">
                        <div className="bg-primary-600 text-white p-4 font-bold">غرفة المحادثة العامة</div>
                        
                        <div className="flex-1 p-4 overflow-y-auto space-y-4 bg-gray-50">
                            {messages.map(msg => (
                                <div key={msg.id} className={`flex ${msg.sender_name === user.name ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[70%] p-3 rounded-lg ${
                                        msg.sender_name === user.name ? 'bg-primary-600 text-white rounded-tl-none' : 
                                        msg.is_admin ? 'bg-red-100 text-red-900 border border-red-200' : 'bg-white text-gray-800 shadow rounded-tr-none'
                                    }`}>
                                        <div className="text-xs opacity-75 mb-1">{msg.sender_name}</div>
                                        <div>{msg.content}</div>
                                    </div>
                                </div>
                            ))}
                            <div ref={messagesEndRef} />
                        </div>

                        <div className="p-4 bg-white border-t flex gap-2">
                            <input 
                                type="text" 
                                value={newMessage}
                                onChange={e => setNewMessage(e.target.value)}
                                onKeyPress={e => e.key === 'Enter' && sendMessage()}
                                className="flex-1 p-2 border rounded-lg focus:ring-2 focus:ring-primary-500 outline-none"
                                placeholder="اكتب رسالتك هنا..."
                            />
                            <button onClick={sendMessage} className="bg-primary-600 text-white px-6 py-2 rounded-lg hover:bg-primary-700">إرسال</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- صفحة المنشورات (Real Database) ---
        const PostsPage = ({ user, onViewChange, onNotification }) => {
            const [posts, setPosts] = useState([]);
            const [newPost, setNewPost] = useState('');

            useEffect(() => {
                const fetchPosts = async () => {
                    const { data } = await supabase
                        .from('posts')
                        .select('*')
                        .order('created_at', { ascending: false });
                    if (data) setPosts(data);
                };
                fetchPosts();

                // تحديث فوري للمنشورات أيضاً
                const channel = supabase
                    .channel('realtime_posts')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, (payload) => {
                        setPosts(prev => [payload.new, ...prev]);
                    })
                    .subscribe();

                return () => supabase.removeChannel(channel);
            }, []);

            const createPost = async () => {
                if (!newPost.trim()) return;

                const { error } = await supabase
                    .from('posts')
                    .insert([{ 
                        content: newPost, 
                        author_name: user.name,
                        study_year: user.study_year
                    }]);

                if (error) {
                    onNotification('حدث خطأ أثناء النشر', 'error');
                } else {
                    setNewPost('');
                    onNotification('تم النشر بنجاح!', 'success');
                }
            };

            return (
                <div className="max-w-2xl mx-auto p-4">
                    <button onClick={() => onViewChange('dashboard')} className="text-right text-gray-500 mb-2">← عودة</button>
                    
                    {/* إضافة منشور */}
                    <div className="bg-white p-4 rounded-xl shadow mb-6">
                        <textarea 
                            value={newPost}
                            onChange={e => setNewPost(e.target.value)}
                            className="w-full p-3 border rounded-lg mb-2 focus:ring-2 focus:ring-primary-500 outline-none resize-none"
                            placeholder="شارك سؤالاً أو معلومة مع زملائك..."
                            rows="3"
                        ></textarea>
                        <button onClick={createPost} className="w-full bg-primary-600 text-white py-2 rounded-lg font-bold">نشر</button>
                    </div>

                    {/* قائمة المنشورات */}
                    <div className="space-y-4">
                        {posts.map(post => (
                            <div key={post.id} className="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                                <div className="flex justify-between items-start mb-2">
                                    <div className="flex items-center gap-2">
                                        <div className="w-8 h-8 bg-primary-100 rounded-full flex items-center justify-center text-primary-700 font-bold">
                                            {post.author_name[0]}
                                        </div>
                                        <div>
                                            <div className="font-bold text-gray-800">{post.author_name}</div>
                                            <div className="text-xs text-gray-500">سنة {post.study_year}</div>
                                        </div>
                                    </div>
                                    <span className="text-xs text-gray-400">
                                        {new Date(post.created_at).toLocaleDateString('ar-EG')}
                                    </span>
                                </div>
                                <p className="text-gray-700 leading-relaxed whitespace-pre-wrap">{post.content}</p>
                            </div>
                        ))}
                        {posts.length === 0 && <p className="text-center text-gray-500">لا توجد منشورات بعد.. كن أول من يكتب!</p>}
                    </div>
                </div>
            );
        };

        const SubjectsPage = ({ onViewChange }) => (
            <div className="p-8 text-center">
                <button onClick={() => onViewChange('dashboard')} className="text-primary-600 mb-4 block">← رجوع</button>
                <h1 className="text-3xl font-bold text-primary-700">المواد الدراسية</h1>
                <p className="mt-4 text-gray-600">هنا تظهر المواد (محتوى ثابت حالياً)</p>
            </div>
        );

        ReactDOM.render(<AcademicVETnew />, document.getElementById('root'));
    </script>
</body>
</html>
